<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conciliador de Inventário e NF-e</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
<div class="container">
    <h2>Conciliação de Inventário & Notas Fiscais</h2>
    <form action="/conciliar" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="inventario">Arquivo de Inventário Físico (CSV):</label>
            <input type="file" id="inventario" name="inventario" accept=".csv" required>
        </div>

        <div class="form-group">
            <label for="xmls">Arquivos XML das Notas Fiscais (Você pode selecionar vários):</label>
            <input type="file" id="xmls" name="xmls" accept=".xml" multiple required>
        </div>

        <button type="submit">Conciliar e Baixar Relatório Excel</button>
    </form>
</div>
</body>
</html>
