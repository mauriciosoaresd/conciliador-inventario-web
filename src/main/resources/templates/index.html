<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conciliador de Inventário Inteligente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #loadingIndicator { display: none; text-align: center; margin-top: 15px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Motor Híbrido de Conciliação</h2>

    <form id="formConciliacao" enctype="multipart/form-data">
        <div class="form-group">
            <label for="inventario">Planilha de Inventário (CSV):</label>
            <input type="file" id="inventario" name="inventario" accept=".csv" required>
        </div>

        <div class="form-group">
            <label for="documentos">Documentos Fiscais (XML, PDF ou Imagens):</label>
            <input type="file" id="documentos" name="documentos" multiple accept=".xml,.pdf,.png,.jpg,.jpeg" required>
        </div>

        <button type="submit" id="btnProcessar">Executar Conciliação</button>

        <div id="loadingIndicator">⏳ Processando conciliação híbrida e gerando relatório... Por favor, aguarde.</div>
    </form>
</div>

<script>
    document.getElementById("formConciliacao").addEventListener("submit", async function(event) {
        event.preventDefault(); // Impede o comportamento padrão de submissão do formulário

        const botao = document.getElementById("btnProcessar");
        const loadingDiv = document.getElementById("loadingIndicator");

        try {
            // 1. Ativa o estado de carregamento e desativa o botão
            botao.disabled = true;
            botao.innerText = "Processando...";
            loadingDiv.style.display = "block";

            const formData = new FormData(this);

            // 2. Envia os dados via Fetch API (assíncrono)
            const response = await fetch('/conciliar', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error("Erro no servidor ao processar a conciliação.");
            }

            // 3. Recebe o blob do Excel gerado pelo backend
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            // 4. Cria dinamicamente um link de download e dispara o clique automático
            const a = document.createElement('a');
            a.href = url;
            a.download = "relatorio-conciliacao-hibrido.xlsx";
            document.body.appendChild(a);
            a.click();
            a.remove();

            window.URL.revokeObjectURL(url);

        } catch (error) {
            alert("Ocorreu um erro: " + error.message);
        } finally {
            // 5. Restaura o botão e oculta o loading IMEDIATAMENTE após o download concluir
            botao.disabled = false;
            botao.innerText = "Executar Conciliação";
            loadingDiv.style.display = "none";
        }
    });
</script>

</body>
</html>
