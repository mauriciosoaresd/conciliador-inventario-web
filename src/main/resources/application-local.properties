spring.datasource.url=${CONCILIADOR_DB_URL:jdbc:h2:file:./data/conciliadordb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${CONCILIADOR_DB_USERNAME:sa}
spring.datasource.password=${CONCILIADOR_DB_PASSWORD:}

spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
