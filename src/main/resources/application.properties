spring.application.name=conciliador-inventario-web
spring.profiles.default=local
conciliador.conciliacao.tolerancia-medida-cm=2
conciliador.conciliacao.limite-similaridade-confirmada=0.35
conciliador.conciliacao.limite-similaridade-sugestao=0.10
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
# Tempo máximo de inatividade da sessão entre o envio da revisão e a geração do
# relatório (0 = sem limite: a revisão não expira)
server.servlet.session.timeout=0
